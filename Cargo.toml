[package]
name = "phoneblock"
version = "0.1.0"
edition = "2021"
authors = ["PhoneBlock CLI Contributors"]
description = "A CLI tool for PhoneBlock REST API"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
colored = "2.1"
comfy-table = "7.1"
indicatif = "0.17"
sha1 = "0.10"
hex = "0.4"
urlencoding = "2.1"
base64 = "0.22"
anyhow = "1.0"
regex = "1.10"

